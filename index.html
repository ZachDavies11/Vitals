<style>
/* Layout: one phone-width column on white, sticky wordmark header, horizontal run cards + list rows, fixed bottom tab bar */
:root{
  --bg:#fffafc; --surface:#ffffff; --soft:#fcf0f5; --soft2:#f6dfe9; --line:#f3e1ea; --shadow:0 2px 10px rgba(120,20,70,.09);
  --ink:#2b0f1e; --ink2:#6f4a5d; --muted:#a8869a;
  --brand:#e62f78; --brand-ink:#ffffff; --brand-soft:#fde4ee; --brand-line:#f6b3cf;
  --teal:#b5175a; --teal-soft:#f9dce8;
  --night:#7d1747; --night-soft:#f0bdd5;
  --coral:#ff5f9a; --coral-soft:#ffe8f1;
  --lane:rgba(230,47,120,.1); --name:#f08cb8;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Mulish",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170c12; --surface:#21111a; --soft:#2b1822; --soft2:#37202d; --line:#3d2534; --shadow:0 2px 10px rgba(0,0,0,.4);
  --ink:#fcecf3; --ink2:#dcb8ca; --muted:#a07e8f;
  --brand:#ff4d8e; --brand-ink:#1d0712; --brand-soft:#42182b; --brand-line:#8a2f57;
  --teal:#ff9cc6; --teal-soft:#3c1b2c; --night:#f3a9cb; --night-soft:#55203d;
  --coral:#ff7aa9; --coral-soft:#401827; --lane:rgba(255,77,142,.1); --name:#ffb6d3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170c12; --surface:#21111a; --soft:#2b1822; --soft2:#37202d; --line:#3d2534; --shadow:0 2px 10px rgba(0,0,0,.4);
  --ink:#fcecf3; --ink2:#dcb8ca; --muted:#a07e8f;
  --brand:#ff4d8e; --brand-ink:#1d0712; --brand-soft:#42182b; --brand-line:#8a2f57;
  --teal:#ff9cc6; --teal-soft:#3c1b2c; --night:#f3a9cb; --night-soft:#55203d;
  --coral:#ff7aa9; --coral-soft:#401827; --lane:rgba(255,77,142,.1); --name:#ffb6d3; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}
.wrap{max-width:480px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.mark{font:italic 900 30px/1 var(--display);letter-spacing:-.03em;color:var(--brand);text-transform:uppercase}
.cd{display:flex;align-items:center;justify-content:flex-end;justify-self:end;gap:6px;color:var(--brand);font-weight:800;font-size:13px}
.who{font:800 13px/1.15 var(--display);color:var(--name);min-width:0}
.cd svg{width:22px;height:22px}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:900 16px var(--display);border:2px solid var(--brand-line)}
.avw{min-width:72px;display:flex;justify-content:flex-end}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:900 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:-.01em}
h2{font:800 21px/1.1 var(--display);letter-spacing:-.01em}
h3{font:800 16px/1.2 var(--display)}
.sub{color:var(--ink2);font-size:13px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.plink{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:800;font-size:14px;padding:4px 0}
.plink svg{width:20px;height:20px}
.sec{display:flex;flex-direction:column;gap:12px}
.sech{display:flex;align-items:center;gap:10px}
.info{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--ink);display:grid;place-items:center;font:800 13px var(--display)}
.info[aria-expanded=true]{background:var(--ink);color:var(--bg)}
.trophies{margin-left:auto;display:flex;gap:2px}
.trophies svg{width:25px;height:25px;color:var(--ink)}
.trophies svg.on{color:var(--brand)}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--ink2)}

/* week strip */
.wk{display:flex;align-items:center;gap:6px}
.wk .nav{width:30px;height:44px;display:grid;place-items:center;color:var(--muted)}
.wk .nav svg{width:18px;height:18px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted)}
.dbtn b{font:800 16px var(--display);color:var(--ink)}
.dbtn .dots{display:flex;gap:3px;height:6px}
.dbtn .dots i{width:6px;height:6px;border-radius:50%}
.dbtn[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.dbtn[aria-pressed=true] b{color:var(--brand-ink)}
.dbtn.today:not([aria-pressed=true]) b{color:var(--brand)}
.i-night{background:var(--night)} .i-run{background:var(--brand)} .i-gym{background:var(--teal)} .i-done{background:var(--ink)}
.dbtn[aria-pressed=true] .dots i{background:var(--brand-ink)}

/* day card */
.dc{border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:var(--shadow)}
.dc .row{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.night,.chip.work{background:var(--night-soft);color:var(--night)}
.chip.post{background:var(--coral-soft);color:var(--coral)}
.chip.off{background:var(--teal-soft);color:var(--teal)}
.chip.zach{background:var(--brand-soft);color:var(--brand)}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--soft)}
.item .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.ico.run{background:var(--brand-soft);color:var(--brand)} .ico.gym{background:var(--teal-soft);color:var(--teal)}
.it{font-weight:800;font-size:14.5px;line-height:1.25}
.id{color:var(--muted);font-size:12.5px;margin-top:2px}
.item.done .it{text-decoration:line-through;color:var(--muted)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--soft2);background:var(--surface);display:grid;place-items:center;flex:none}
.ck svg{width:15px;height:15px;opacity:0}
.ck.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ck.on svg{opacity:1}
.rest{font-size:14px;color:var(--ink2);line-height:1.5}

/* run cards */
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-bottom:10px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.rc.solo{flex:none;width:100%;max-width:none}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acts .btn{flex:1}
.acts .state{flex:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--ink2)}
.acts .state svg{width:18px;height:18px;color:var(--brand)}
.opt-pill{display:inline-block;font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);background:var(--soft2);border-radius:999px;padding:3px 8px;vertical-align:middle;margin-left:6px}
.rc.skipped .t,.lr.skipped .t{color:var(--muted)}
.workday{display:flex;align-items:center;gap:14px;border-radius:16px;padding:18px;background:var(--night-soft);color:var(--night);font:800 18px var(--display)}
.workday svg{width:28px;height:28px}
.xrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--soft)}
.xrow .grow{flex:1;min-width:0}
.addx{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed var(--brand-line);border-radius:16px;padding:16px;color:var(--brand);font-weight:800}
.addx svg{width:18px;height:18px}
.i-skip{background:var(--muted)}
.dist{font:italic 900 64px/0.95 var(--display);color:var(--brand);letter-spacing:-.03em}
.dist small{font-size:20px;letter-spacing:0;margin-left:6px;font-style:normal;text-transform:uppercase}
ol.plan{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
ol.plan li{counter-increment:st;display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.45;font-weight:600}
ol.plan li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:800 13px var(--display);margin-top:-1px}
.pz{display:inline-block;white-space:nowrap;font-weight:800;color:var(--brand)}
.dist.gymt{font-size:44px;line-height:1;color:var(--teal);text-transform:uppercase}
.gplan li::before{background:var(--teal-soft);color:var(--teal)}
.locked{background:var(--soft);border-radius:14px;padding:12px 14px;font-weight:800;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.locked svg{width:18px;height:18px;color:var(--brand)}
.near{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.near button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:var(--soft);min-width:0;font-size:12px;color:var(--ink2)}
.near button.r{justify-content:flex-end;text-align:right}
.near button b{display:block;font-weight:800;color:var(--ink);font-size:12.5px}
.near button span span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.near button>span:not(.nv){min-width:0}
.near .nv{width:16px;height:16px;flex:none;color:var(--brand)}
.ck[disabled]{opacity:.45;cursor:default}
.pst{flex:none;font-size:12px;font-weight:800;color:var(--muted);display:flex}
.pst svg{width:20px;height:20px;color:var(--brand)}
.rline{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--ink2)}
.rline svg{width:20px;height:20px;color:var(--brand)}
.bkrem{display:flex;align-items:center;gap:12px;width:100%;border-radius:16px;padding:12px 14px;background:var(--brand);color:var(--brand-ink)}
.bkrem>svg{width:24px;height:24px;flex:none}
.bkrem b{display:block;font:800 15px var(--display)}
.bkrem span span{display:block;font-size:12.5px;opacity:.9;margin-top:2px}
.bkrem .chev{width:18px;height:18px;margin-left:auto;flex:none}
.wcard{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:10px}
.wrow .in{flex:1;min-width:0}
.wrow>div:first-child{flex:1}
.wv{font:900 26px/1 var(--display)}
.wv small{font-size:14px;color:var(--muted);margin-left:4px}
.wcard .m{color:var(--muted);font-size:12.5px;font-weight:700}
.sech .chip{margin-left:auto}
.btn.sskip{background:var(--night-soft);color:var(--night)}
.acts .full-row{flex-basis:100%}
.logbox{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.ready{display:flex;gap:12px;align-items:center;border-radius:14px;padding:9px 12px;background:var(--brand-soft);width:100%;min-height:46px}
.ready .gauge{display:flex;align-items:flex-end;gap:3px;height:20px;flex:none}
.ready .gauge i{width:6px;border-radius:2px;background:var(--surface)}
.ready .gauge i:nth-child(1){height:8px}.ready .gauge i:nth-child(2){height:14px}.ready .gauge i:nth-child(3){height:20px}
.ready .gauge i.on{background:var(--brand)}
.ready .rt{flex:1;min-width:0;font:800 15px/1.2 var(--display);color:var(--brand)}
.ready .btn{padding:6px 12px;font-size:12.5px}
.ready .chev{width:16px;height:16px;color:var(--brand)}
.ready.lv-ready{background:var(--brand)}
.ready.lv-ready .rt{color:var(--brand-ink)}
.ready.lv-ready .gauge i{background:rgba(255,255,255,.35)}.ready.lv-ready .gauge i.on{background:var(--brand-ink)}
.ready.lv-rest{background:var(--night-soft)}
.ready.lv-rest .rt{color:var(--night)}.ready.lv-rest .gauge i.on{background:var(--night)}
.ready.lv-rest .btn{background:var(--night);color:var(--bg)}
.ready.none .rt{color:var(--ink2);font-size:14px}
.rc.gymc .art{background:var(--teal-soft)}
.rc.gymc .art::before{background:linear-gradient(var(--lane) 2px,transparent 2px) 0 0/100% 34px,linear-gradient(90deg,var(--lane) 2px,transparent 2px) 0 0/34px 100%}
.rc.gymc .gart{position:absolute;right:14px;bottom:10px;width:150px;height:110px;color:var(--teal)}
.rc.gymc .t{color:var(--teal)}
.rc.gymc.next{border-bottom-color:var(--teal)}
.rc.gymc.done .t,.rc.gymc.skipped .t{color:var(--muted)}
.slc{display:flex;align-items:center;gap:14px;width:100%;border-radius:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.slc .ic{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.slc .ic svg{width:24px;height:24px}
.slc .h{font:900 22px/1 var(--display)}
.slc .m{color:var(--muted);font-size:12.5px;font-weight:700;margin-top:4px}
.mini{display:flex;align-items:flex-end;gap:3px;height:38px;margin-left:auto;flex:none}
.mini i{width:7px;border-radius:3px;background:var(--brand-line)}
.mini i.on{background:var(--brand)}
.mini i.no{background:var(--soft2);height:4px}
.slnav{display:flex;align-items:center;gap:8px}
.slnav h3{flex:1;text-align:center}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dur{display:flex;align-items:baseline;gap:8px}
.dur b{font:900 36px/1 var(--display);color:var(--brand)}
.qual{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qual button{padding:9px 0;border-radius:12px;background:var(--soft);text-align:center;font-size:12px;font-weight:800;color:var(--ink2)}
.qual button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.nights{display:flex;flex-direction:column}
.nights button{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);font-size:14px;font-weight:700;width:100%}
.nights button .d{flex:1}
.nights button span{color:var(--ink2)}
.streak{display:flex;flex-direction:column;gap:10px;border-radius:18px;padding:14px 16px;background:var(--brand-soft)}
.streak .top1{display:flex;align-items:center;gap:10px}
.streak .fl{display:grid;place-items:center;color:var(--brand);flex:none;width:40px;height:40px}
.streak .fl svg{width:100%;height:100%}
.streak b{font:900 18px var(--display);color:var(--ink)}
.streak .goal1{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ink2);text-align:right}
.segs{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.segs i{height:8px;border-radius:4px;background:var(--surface)}
.segs i.on{background:var(--brand)}
.segs i.cur{background:var(--brand-line)}
.prize{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:transparent;padding:24px;pointer-events:none;transition:background .4s}
.prize.show{background:rgba(43,15,30,.5);pointer-events:auto}
.prize .box{opacity:0;transform:scale(.5)}
.prize.show .box{animation:pop .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.prize .won{font:italic 900 22px/1.15 var(--display);color:var(--ink);text-transform:uppercase}
.prize .box{position:relative;z-index:2;max-width:340px;width:100%;background:var(--bg);border-radius:26px;padding:28px 22px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 20px 60px rgba(120,20,70,.35)}
.prize .tro{width:84px;height:84px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.prize .tro svg{width:46px;height:46px}
.prize h2{font:italic 900 28px/1.05 var(--display);color:var(--brand);text-transform:uppercase}
.prize p{margin:0;color:var(--ink2);line-height:1.5;font-size:15px}
#confetti{position:fixed;inset:0;z-index:61;pointer-events:none;width:100%;height:100%}
.rc{flex:0 0 74%;max-width:300px;scroll-snap-align:start;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);border-bottom:4px solid transparent;display:flex;flex-direction:column}
.rc.next{border-bottom-color:var(--brand)}
.art{position:relative;height:136px;background:var(--soft);overflow:hidden}
.art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(104deg,transparent 0 46px,var(--lane) 46px 49px)}
.art .big{position:absolute;right:12px;bottom:-12px;font:italic 900 104px/1 var(--display);letter-spacing:-.05em;color:var(--brand);opacity:.9}
.art .big small{font-size:22px;letter-spacing:0;margin-left:2px}
.art .tag{position:absolute;left:12px;top:12px}
.art .okb{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.art .okb svg{width:15px;height:15px}
.k-long .art{background:var(--brand-soft)}
.k-tempo .art,.k-speed .art,.k-goal .art{background:var(--coral-soft)}
.k-tempo .art .big,.k-speed .art .big,.k-goal .art .big{color:var(--coral)}
.k-race .art{background:var(--ink)} .k-race .art .big{color:var(--brand)}
.k-race .art::before{background:repeating-linear-gradient(104deg,transparent 0 46px,rgba(255,255,255,.08) 46px 49px)}
.k-optional .art .big{color:var(--muted)}
.rc .body{padding:12px 14px 14px}
.rc .t{font:800 19px/1.15 var(--display);color:var(--brand)}
.rc.done .t{color:var(--muted)}
.rc .m{color:var(--muted);font-size:12.5px;font-weight:700;margin-top:5px}

function saveShifts(){
  const [y,mo]=shM.split("-").map(Number), n=new Date(Date.UTC(y,mo,0)).getUTCDate();
  const ds=[...Array(n)].map((_,i)=>shM+"-"+String(i+1).padStart(2,"0"));
  const changed=new Set();
  ds.forEach(s=>{let v=s in draft?draft[s]:(PLAN[s]&&PLAN[s].shift)||"";if(!v)v="off";
    const old=PLAN[s]||{};if(old.shift!==v){changed.add(s);changed.add(add(s,1));PLAN[s]=Object.assign({run:null,gym:null,note:"",src:"auto"},old,{shift:v});if(v!=="other")delete PLAN[s].shiftLabel}});
  // which days to re-plan: everything (rebuild), or whole weeks touched by a change plus days with nothing planned
  let target=new Set();
  if(rebuild)ds.forEach(s=>target.add(s));
  else{ds.forEach(s=>{const p=PLAN[s];if(!p||!p.src||(!p.run&&!p.gym&&!p.note&&p.src==="auto"))target.add(s)});
    [...changed].forEach(c=>{const m=monOf(c);[0,1,2,3,4,5,6].forEach(i=>{const s=add(m,i);if(PLAN[s]&&PLAN[s].shift)target.add(s)})})}
  changed.forEach(s=>{if(PLAN[s]&&s.startsWith(shM))persist("days",s,PLAN[s])});
  const r=buildPlan([...target]);
  draft={};toast=MOL[mo-1]+" saved. "+(r.n?r.r+" runs and "+r.g+" gym sessions planned.":"Nothing needed re-planning.");render();
}

  const addPace=t=>/tempo/i.test(t)?t+" "+Tm:/5K effort/i.test(t)?t+" "+K:/half pace|goal pace|10K effort/i.test(t)?t+(/10K/.test(t)?"":" "+H):/easy|jog/i.test(t)&&!/between|jog between/i.test(t)?t+" "+E:t;
  if(r.kind==="race")return (r.detail||"").split(/(?<=\.)\s+/).filter(Boolean).map(esc);
  const d=(r.detail||"").replace(/\s+/g," ").trim();
  if(["tempo","speed","goal"].includes(r.kind)||/, then /.test(d)){const first=d.split(/(?<=\.)\s+/)[0]||"",rest=d.slice(first.length).trim();
    const st=first.replace(/\.$/,"").split(/, then |, (?=easy to finish)|, (?=\d+ mi easy$)/).map(x=>cap(x.trim())).filter(Boolean).map(x=>addPace(esc(x)));
    return rest?[...st,esc(rest)]:st}
  const st=[`Run ${r.mi} miles at an easy pace ${E}`];
  if(/strides/i.test(r.title))st.push("Finish with 4 strides: 20 seconds smooth and fast, full recovery between");
  if(r.kind==="long")st.push("Walk breaks are fine. Bring water if it's warm");
  if(d&&!/^Strides:/.test(d))st.push(esc(d));
  st.push("Keep it conversational. If it feels hard, slow down");
  return st}

    const old=sleepOf(s)||{},v={bed,wake,h:+h.toFixed(2)};const q=slQ!=null?slQ:old.q;if(q)v.q=q;const hr=document.getElementById("shr").value?parseInt(document.getElementById("shr").value,10):0;if(hr>=30&&hr<=150)v.hr=hr;

  if(A.recapclose!==undefined&&(b.tagName==="BUTTON"||e.target===b)){try{localStorage.setItem("vitals-recap-"+recapOpen,"1")}catch(_){}recapOpen=null;render();return}

  if(A.claim){prizeShown=false;SET=Object.assign({},SET,{rewards:[...(SET.rewards||[]),A.claim]});persist("settings","main",SET);render();return}
  if(A.loggym2){const s=A.loggym2,old=log(s).gym||{},v={done:true,at:old.at||Date.now()};const mn=parseInt(document.getElementById("gmin").value,10);if(mn>0&&mn<600)v.min=mn;
    const hr=readHR("ghr");if(hr)v.hr=hr;const f=feelPick!=null?feelPick:old.feel;if(f!=null)v.feel=f;const nt=document.getElementById("gnote").value.trim();if(nt)v.note=nt;

  if(A.skip){const[s,k]=A.skip.split("|");setLog(s,k,{skipped:true,at:Date.now()});sheet=null;render();return}
